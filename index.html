<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickBite - Online Ordering</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>🍔 QuickBite</h1>
      <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#cart">My Cart</a>
      </nav>
    </header>

    <section class="hero" id="home">
      <h2>Delicious Food Delivered To You!</h2>
      <p>Order your favorite meals online.</p>
      <a href="#menu" class="hero-btn">Order Now</a>
    </section>

    <main>
      <section id="menu">
        <h2>Our Menu</h2>
        <div class="products" id="product-list">Loading products...</div>
      </section>

      <section id="cart">
        <h2>🛒 Shopping Cart</h2>
        <div id="cart-items"></div>
        <h3>Total: ₱<span id="total">0.00</span></h3>
        <button onclick="checkout()">Proceed to Checkout</button>
      </section>

      <section id="checkout">
        <h2>Customer Information</h2>

        <form id="order-form">
          <input type="text" id="customer" placeholder="Full Name" required />

          <input type="tel" id="phone" placeholder="Phone Number" required />

          <textarea
            id="address"
            placeholder="Complete Delivery Address"
            required
          ></textarea>

          <select id="payment" required>
            <option value="">Select Payment Method</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="GCash">GCash</option>
          </select>

          <button type="submit">Place Order</button>
        </form>

        <div id="confirmation"></div>
      </section>
    </main>

    <footer>
      <p>© 2026 QuickBite Online Ordering System</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
